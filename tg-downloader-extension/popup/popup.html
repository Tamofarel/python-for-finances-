<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TG Downloader Pro</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
          <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
        </svg>
        <h1>TG Downloader Pro</h1>
      </div>
      <span class="version">v1.0.0</span>
    </header>

    <!-- Status -->
    <div class="status-bar" id="statusBar">
      <div class="status-indicator"></div>
      <span id="statusText">Checking connection...</span>
    </div>

    <!-- Media Stats -->
    <section class="media-stats" id="mediaStats">
      <div class="stat-card" data-type="videos">
        <div class="stat-icon video-icon">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
          </svg>
        </div>
        <div class="stat-info">
          <span class="stat-count" id="videoCount">0</span>
          <span class="stat-label">Videos</span>
        </div>
      </div>
      
      <div class="stat-card" data-type="audios">
        <div class="stat-icon audio-icon">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
          </svg>
        </div>
        <div class="stat-info">
          <span class="stat-count" id="audioCount">0</span>
          <span class="stat-label">Audio</span>
        </div>
      </div>
      
      <div class="stat-card" data-type="images">
        <div class="stat-icon image-icon">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/>
          </svg>
        </div>
        <div class="stat-info">
          <span class="stat-count" id="imageCount">0</span>
          <span class="stat-label">Images</span>
        </div>
      </div>
      
      <div class="stat-card" data-type="documents">
        <div class="stat-icon doc-icon">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
          </svg>
        </div>
        <div class="stat-info">
          <span class="stat-count" id="docCount">0</span>
          <span class="stat-label">Files</span>
        </div>
      </div>
    </section>

    <!-- Quick Actions -->
    <section class="actions">
      <button class="action-btn primary" id="scanBtn">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
        </svg>
        Scan for Media
      </button>
      
      <button class="action-btn secondary" id="downloadAllBtn" disabled>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
        </svg>
        Download All
      </button>
    </section>

    <!-- Downloads -->
    <section class="downloads-section">
      <h2>Active Downloads</h2>
      <div class="downloads-list" id="downloadsList">
        <div class="empty-state">
          <svg viewBox="0 0 24 24" width="40" height="40" fill="currentColor" opacity="0.3">
            <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
          </svg>
          <p>No active downloads</p>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <a href="#" id="settingsLink">Settings</a>
      <span>•</span>
      <a href="https://github.com" target="_blank">GitHub</a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
